<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ItzF18 Bot</title>
<style>
:root{
  --bg:#0a0c11; --surface:#11141b; --surface2:#171b24; --border:#1f2531;
  --text:#eef0f4; --muted:#9aa1b0; --primary:#5865F2; --primary-h:#4752c4;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:inherit;text-decoration:none}

nav{position:sticky;top:0;z-index:20;background:rgba(10,12,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-in{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:#fff;display:flex;align-items:center;gap:8px}
.logo b{color:var(--primary)}
.links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.links a{padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:600}
.links a:hover,.links a.active{background:var(--surface2);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:#fff;font-size:14px;font-weight:700}
.btn.primary{background:var(--primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-h)}
.btn.sm{padding:6px 11px;font-size:12px}

main{max-width:1000px;margin:auto;padding:24px 16px 60px}
.hero{text-align:center;padding:50px 10px 30px}
.hero h1{font-size:34px;font-weight:800;margin-bottom:10px}
.hero h1 b{color:var(--primary)}
.hero p{color:var(--muted);max-width:580px;margin:0 auto 22px;font-size:15px}
.hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted)}
.sec-title{font-size:20px;font-weight:800;margin:34px 0 14px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-top:14px}
.box h2{font-size:20px;margin-bottom:8px}
.box p{color:var(--muted);font-size:14px;margin-bottom:10px}
footer{text-align:center;color:#5b6272;font-size:12px;padding:30px 0}
</style>
</head>
<body>
<nav>
  <div class="nav-in">
    <a class="logo" href="#/">⚡ <span>ItzF18 <b>Bot</b></span></a>
    <div class="links">
      <a href="#/" data-r="home">الرئيسية</a>
      <a href="#/commands" data-r="commands">الأوامر</a>
      <a href="#/roles" data-r="roles">الصلاحيات</a>
    </div>
    <div>
      <a class="btn primary sm" href="https://discord.com/oauth2/authorize?client_id=1546817538149711922&permissions=8&integration_type=0&scope=bot" target="_blank" rel="noopener">➕ إضافة البوت</a>
    </div>
  </div>
</nav>

<main id="app"></main>
<footer>ItzF18 Bot</footer>

<script>
const app = document.getElementById('app');

function renderHome() {
  app.innerHTML = `
    <section class="hero">
      <h1>بوت <b>ItzF18</b> لإدارة سيرفرك</h1>
      <p>يعمل تلقائياً على السيرفرات الموجود فيها، يسجل اللوقز، ويتحقق من رتبة الحساب في كل سيرفر (أدمن أو عضو).</p>
      <div class="cta">
        <a class="btn primary" href="https://discord.com/oauth2/authorize?client_id=1546817538149711922&permissions=8&integration_type=0&scope=bot" target="_blank" rel="noopener">➕ إضافة البوت لسيرفرك</a>
        <a class="btn" href="#/roles">🛡️ نظام الصلاحيات</a>
      </div>
    </section>
    <div class="sec-title">المميزات</div>
    <div class="grid">
      <div class="card"><h3>📜 سجلات تلقائية</h3><p>يحدد السيرفرات تلقائياً ويسجل الأحداث في روم السجلات المناسب.</p></div>
      <div class="card"><h3>🛡️ أدمن أو عضو</h3><p>يفحص رتبة الشخص بكل سيرفر؛ إذا كان عضواً عادياً لا يعمل معه أي أمر إداري.</p></div>
      <div class="card"><h3>⚔️ إدارة السيرفر</h3><p>تنظيم الرايدات والأدوات الإدارية للسيرفرات المشتركة.</p></div>
    </div>`;
}

function renderCommands() {
  app.innerHTML = `
    <div class="sec-title" style="margin-top:6px">📖 الأوامر والعمل</div>
    <div class="box">
      <h2>التشغيل التلقائي والسجلات</h2>
      <p>• يعمل البوت تلقائياً على كل سيرفر يضمّه ويتابع السجلات دون إعداد يدوي.</p>
      <p>• الأوامر الإدارية تعمل فقط مع الأدمن.</p>
    </div>`;
}

function renderRoles() {
  app.innerHTML = `
    <div class="box">
      <h2>أدمن مقابل عضو</h2>
      <p>• يتعرف البوت على السيرفرات المشتركة ويحدد في كل سيرفر هل الحساب <b>أدمن</b> أو <b>عضو</b>.</p>
      <p>• إذا كان الحساب <b>عضواً</b> فقط، يتم رفض التنفيذ فوراً ولا يعمل معه أي شيء.</p>
    </div>`;
}

function route() {
  const h = (location.hash || '#/').slice(1);
  document.querySelectorAll('.links a').forEach(a => a.classList.remove('active'));
  if (h.startsWith('/commands')) {
    document.querySelector('.links a[data-r="commands"]')?.classList.add('active');
    return renderCommands();
  }
  if (h.startsWith('/roles')) {
    document.querySelector('.links a[data-r="roles"]')?.classList.add('active');
    return renderRoles();
  }
  document.querySelector('.links a[data-r="home"]')?.classList.add('active');
  return renderHome();
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
