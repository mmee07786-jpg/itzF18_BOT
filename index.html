<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ItzF18 Bot - لوحة التحكم</title>
<style>
:root{
  --bg:#0a0c11; --surface:#11141b; --surface2:#171b24; --border:#1f2531;
  --text:#eef0f4; --muted:#9aa1b0; --primary:#5865F2; --primary-h:#4752c4;
  --green:#3ba55d; --red:#ed4245; --orange:#faa61a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* الشريط العلوي */
nav{position:sticky;top:0;z-index:20;background:rgba(10,12,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-in{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:#fff;display:flex;align-items:center;gap:8px}
.logo b{color:var(--primary)}
.links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.links a{padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:600}
.links a:hover,.links a.active{background:var(--surface2);color:#fff}
.nav-r{display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:#fff;font-size:14px;font-weight:700;transition:.15s}
.btn:hover{background:#202533}
.btn.primary{background:var(--primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-h)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{max-width:1000px;margin:auto;padding:24px 16px 60px}

/* الرئيسية */
.hero{text-align:center;padding:50px 10px 30px}
.hero h1{font-size:34px;font-weight:800;margin-bottom:10px}
.hero h1 b{color:var(--primary)}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 22px;font-size:15px}
.hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats{display:flex;gap:12px;justify-content:center;margin:26px 0;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 26px;text-align:center;min-width:140px}
.stat b{display:block;font-size:24px;color:#fff}
.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted)}
.sec-title{font-size:20px;font-weight:800;margin:34px 0 14px}

/* الأوامر */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input[type=text],select{background:var(--surface);border:1px solid var(--border);color:#fff;border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;width:100%}
input[type=text]:focus,select:focus{outline:none;border-color:var(--primary)}
.toolbar input{flex:2;min-width:180px}.toolbar select{flex:1;min-width:150px}
.cmd{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.cmd-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmd-name{font-family:Consolas,monospace;font-weight:700;color:#fff;background:var(--surface2);padding:3px 10px;border-radius:7px;direction:ltr}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#3a2a10;color:var(--orange);font-weight:700}
.cmd p{color:#c9cdd6;font-size:14px;margin-top:8px}
.opts{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.opt{font-size:12.5px;color:var(--muted)}
.opt code{color:#c3c8ff;background:var(--surface2);padding:1px 6px;border-radius:5px;direction:ltr;display:inline-block}
.cat-title{font-size:15px;font-weight:800;margin:22px 0 10px;color:#dfe2ff}

/* قائمة السيرفرات */
.srv{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.srv img,.srv .ph{width:46px;height:46px;border-radius:50%;background:var(--surface2);flex-shrink:0;object-fit:cover}
.srv .ph{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted)}
.srv .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv .nm small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);margin-top:1px}
.role{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.role.owner{background:#3a2e10;color:#ffd166}
.role.admin{background:#1d2a4d;color:#9fb0ff}
.role.manage{background:#14352a;color:#6fdc8c}

/* تنبيهات */
.note{background:#14202e;border:1px solid #23415f;color:#a9cdee;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.8}
.warnbox{background:#2b2110;border:1px solid #5b4416;color:#ffd08a;border-radius:12px;padding:12px 14px;font-size:13px;margin:16px auto;line-height:1.9;max-width:600px;text-align:right}
.warnbox code,.note code{background:#000;padding:2px 8px;border-radius:6px;direction:ltr;display:inline-block;word-break:break-all;color:#c3c8ff;user-select:all}
details.help{max-width:600px;margin:18px auto 0;text-align:right;color:var(--muted);font-size:13px}
details.help summary{cursor:pointer;color:#c3c8ff;font-weight:700}
details.help ol{margin:10px 22px;line-height:2}
.copy{margin-inline-start:6px}

/* لوحة السيرفر */
.back{display:inline-block;margin-bottom:14px;color:var(--muted);font-size:14px}
.g-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.g-head img{width:54px;height:54px;border-radius:50%}
.g-head h2{font-size:21px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick select{flex:1;min-width:180px}
.log{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.log.err{border-color:#5a2226}
.log-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.log-t{font-weight:800;font-size:15px}
.log-d{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
.log-c{display:flex;gap:8px;flex-wrap:wrap}
.log-c select{flex:1;min-width:180px}
.st{font-size:12.5px;margin-top:8px;min-height:0}
.st.bad{color:#ff7b7e}.st.good{color:#6fdc8c}.st.warn{color:var(--orange)}

.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:#2a303d;border-radius:26px;transition:.2s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;top:3px;right:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{right:23px}

.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);padding:16px 0 4px;margin-top:10px}
.savebar .btn{width:100%;padding:13px;font-size:15px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);padding:11px 20px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw}
.toast.ok{border-color:var(--green)}.toast.bad{border-color:var(--red)}
.center{text-align:center;padding:50px 10px;color:var(--muted)}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.user-chip img{width:28px;height:28px;border-radius:50%}
footer{text-align:center;color:#5b6272;font-size:12px;padding:30px 0}
</style>
</head>
<body>
<nav>
  <div class="nav-in">
    <a class="logo" href="#/">⚡ <span>ItzF18 <b>Bot</b></span></a>
    <div class="links">
      <a href="#/" data-r="home">الرئيسية</a>
      <a href="#/commands" data-r="commands">الأوامر</a>
      <a href="#/dashboard" data-r="dashboard">لوحة التحكم</a>
    </div>
    <div class="nav-r" id="navr"></div>
  </div>
</nav>

<main id="app"><div class="center">جاري التحميل...</div></main>
<footer>ItzF18 Bot © لوحة التحكم</footer>

<script>
const CLIENT_ID = "1546817538149711922";
const INVITE = "https://discord.com/oauth2/authorize?client_id=" + CLIENT_ID + "&permissions=8&integration_type=0&scope=bot";
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/*
  وضعين للتشغيل (يتحدد تلقائياً):
  - backend: الموقع مفتوح من سيرفر البوت نفسه (فيه /api)، تسجيل الدخول يمر عبر السيرفر.
  - static : الموقع على استضافة ثابتة مثل GitHub Pages. تسجيل الدخول يتم من المتصفح مباشرة عبر ديسكورد (OAuth2 implicit)
             بدون أي سيرفر، ويتعرف على حسابك وسيرفراتك اللي أنت فيها مالك/أدمن/إدارة سيرفر.
*/
let mode = 'static';
let me = { loggedIn: false };

/* ═══════════ تخزين آمن (sessionStorage) ═══════════ */
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};

/* رابط الرجوع (Redirect URI): لازم يتضاف بنفس الشكل بالضبط بـ Discord Developer Portal → OAuth2 → Redirects */
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, '');

function toast(msg, type) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

async function api(path, body) {
  const opts = { credentials: 'same-origin', headers: {} };
  if (body !== undefined) {
    opts.method = 'POST';
    opts.headers['Content-Type'] = 'application/json';
    opts.headers['X-Requested-With'] = 'dashboard';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('application/json')) { const e = new Error('NO_BACKEND'); e.noBackend = true; throw e; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(typeof data.error === 'object' && data.error ? (data.error.ar || data.error.en) : (data.error || ('HTTP ' + res.status))); e.status = res.status; throw e; }
  return data;
}

/* ═══════════ تسجيل الدخول المباشر (وضع static) ═══════════ */
function startLogin() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  const state = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  store.set('oauth_state', state);
  const url = 'https://discord.com/oauth2/authorize?' + new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'token',
    redirect_uri: REDIRECT_URI,
    scope: 'identify guilds',
    state: state
  });
  location.href = url;
}

/* يقرأ رد ديسكورد من الرابط (التوكن يجي بعد # والأخطاء بعد ?) */
function consumeOAuthResponse() {
  const hash = location.hash.replace(/^#/, '');
  const q = new URLSearchParams(location.search);
  const cleanTo = (h) => history.replaceState(null, '', location.pathname + (h || '#/'));

  if (q.get('error')) {
    const e = q.get('error');
    cleanTo('#/dashboard');
    toast(e === 'access_denied' ? 'تم إلغاء تسجيل الدخول.' : 'فشل تسجيل الدخول: ' + (q.get('error_description') || e), 'bad');
    return;
  }

  if (hash.includes('access_token=')) {
    const p = new URLSearchParams(hash);
    const saved = store.get('oauth_state');
    store.del('oauth_state');
    if (!p.get('state') || p.get('state') !== saved) {
      cleanTo('#/dashboard');
      toast('طلب تسجيل الدخول غير صالح، جرّب مرة ثانية.', 'bad');
      return;
    }
    const expires = Date.now() + (Number(p.get('expires_in')) || 3600) * 1000;
    store.set('dc_token', p.get('access_token'));
    store.set('dc_expires', String(expires));
    store.del('dc_profile');
    cleanTo('#/dashboard');
  }
}

async function discord(path, token) {
  const r = await fetch('https://discord.com/api/v10' + path, { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) { const e = new Error('unauthorized'); e.code = 401; throw e; }
  if (r.status === 429) { const e = new Error('rate'); e.code = 429; throw e; }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

const P_ADMIN = 0x8n, P_MANAGE = 0x20n;
function roleOf(g) {
  if (g.owner) return 'owner';
  let p = 0n;
  try { p = BigInt(g.permissions || 0); } catch (e) {}
  if ((p & P_ADMIN) === P_ADMIN) return 'admin';
  if ((p & P_MANAGE) === P_MANAGE) return 'manage';
  return null;
}

async function loadStaticSession() {
  const token = store.get('dc_token');
  const exp = Number(store.get('dc_expires') || 0);
  if (!token || exp < Date.now()) { store.del('dc_token'); store.del('dc_expires'); store.del('dc_profile'); return { loggedIn: false }; }

  // نخزن البروفايل دقيقتين عشان ما نتعدى حد الطلبات لو أعاد المستخدم تحميل الصفحة
  let profile = null;
  try { const c = JSON.parse(store.get('dc_profile') || 'null'); if (c && Date.now() - c.ts < 120000) profile = c; } catch (e) {}

  if (!profile) {
    try {
      const [u, g] = await Promise.all([discord('/users/@me', token), discord('/users/@me/guilds', token)]);
      profile = { ts: Date.now(), u, g };
      store.set('dc_profile', JSON.stringify(profile));
    } catch (e) {
      if (e.code === 401) { store.del('dc_token'); store.del('dc_expires'); store.del('dc_profile'); return { loggedIn: false }; }
      if (e.code === 429) { toast('طلبات كثيرة لديسكورد، انتظر شوي وحدّث الصفحة.', 'bad'); return { loggedIn: false }; }
      toast('تعذر الاتصال بديسكورد.', 'bad');
      return { loggedIn: false };
    }
  }

  const order = { owner: 0, admin: 1, manage: 2 };
  const guilds = (profile.g || [])
    .map(x => ({ id: x.id, name: x.name, icon: x.icon ? `https://cdn.discordapp.com/icons/${x.id}/${x.icon}.png` : null, role: roleOf(x) }))
    .filter(x => x.role)
    .sort((a, b) => (order[a.role] - order[b.role]) || a.name.localeCompare(b.name));

  return {
    loggedIn: true, loginEnabled: true,
    user: { id: profile.u.id, username: profile.u.username, globalName: profile.u.global_name || null, avatar: profile.u.avatar || null },
    guilds, staticMode: true
  };
}

function logout() {
  store.del('dc_token'); store.del('dc_expires'); store.del('dc_profile');
  me = { loggedIn: false };
  renderNav();
  location.hash = '#/';
  route();
}

/* ───── الشريط العلوي ───── */
function renderNav() {
  const r = document.getElementById('navr');
  const invite = `<a class="btn primary sm" href="${INVITE}" target="_blank" rel="noopener">➕ إضافة البوت</a>`;
  if (me.loggedIn) {
    const av = me.user.avatar ? `<img src="https://cdn.discordapp.com/avatars/${esc(me.user.id)}/${esc(me.user.avatar)}.png?size=64" alt="">` : '';
    const out = mode === 'static' ? `<button class="btn sm" id="logoutBtn">خروج</button>` : `<a class="btn sm" href="/logout">خروج</a>`;
    r.innerHTML = `${invite}<div class="user-chip">${av}<span>${esc(me.user.globalName || me.user.username)}</span></div>${out}`;
    const lb = document.getElementById('logoutBtn');
    if (lb) lb.onclick = logout;
  } else {
    r.innerHTML = `${invite}<a class="btn sm" href="/login" id="loginBtn">تسجيل الدخول</a>`;
    const b = document.getElementById('loginBtn');
    if (b && mode === 'static') b.onclick = ev => { ev.preventDefault(); startLogin(); };
  }
}

/* ───── الرئيسية ───── */
async function renderHome() {
  app.innerHTML = `
    <section class="hero">
      <h1>بوت <b>ItzF18</b> لإدارة سيرفرك</h1>
      <p>سجلات متقدمة، حماية، رايدات وتوبات، رتب تلقائية، وذكاء اصطناعي. تحكم بكل شي من الموقع.</p>
      <div class="cta">
        <a class="btn primary" href="${INVITE}" target="_blank" rel="noopener">➕ إضافة البوت لسيرفرك</a>
        <a class="btn" href="#/dashboard">🎛️ لوحة التحكم</a>
      </div>
    </section>
    <div class="stats" id="stats"></div>
    <div class="sec-title">المميزات</div>
    <div class="grid">
      <div class="card"><h3>📜 سجلات السيرفر</h3><p>حذف وتعديل الرسائل، الرومات الصوتية، الطرد والباند والتايم أوت مع اسم المنفذ والسبب. كل سيرفر بإعداداته المستقلة.</p></div>
      <div class="card"><h3>⚔️ الرايدات والتوبات</h3><p>إعلان الرايد، تسجيل النتائج، لوحة توب 10 و 20 تتحدث تلقائياً، ورتب حسب عدد الرايدات.</p></div>
      <div class="card"><h3>🛡️ الحماية</h3><p>كلمات ممنوعة مع تحذيرات وعقوبة تلقائية (طرد، باند، تايم أوت) تحددها أنت.</p></div>
      <div class="card"><h3>👋 الترحيب والبوست</h3><p>رسائل ترحيب ومغادرة وشكر البوست بصور ورسائل مخصصة.</p></div>
      <div class="card"><h3>🤖 ذكاء اصطناعي</h3><p>منشن البوت ويقرأ الصور والفيديوهات ويكتب الأكواد كملفات.</p></div>
      <div class="card"><h3>💾 النسخ الاحتياطي</h3><p>نسخ واستعادة بنية السيرفر بخطوات بسيطة.</p></div>
    </div>`;
  if (mode !== 'backend') return;
  try {
    const s = await api('/api/stats');
    document.getElementById('stats').innerHTML =
      `<div class="stat"><b>${s.guilds}</b><span>سيرفر</span></div><div class="stat"><b>${s.members.toLocaleString('en')}</b><span>عضو</span></div>`;
  } catch (e) {}
}

/* ───── الأوامر ───── */
async function renderCommands() {
  if (mode !== 'backend') {
    app.innerHTML = `<div class="center"><h2 style="color:#fff;margin-bottom:10px">📖 شرح الأوامر</h2>
      <div class="note" style="max-width:560px;margin:auto">قائمة الأوامر تنجلب من سيرفر البوت، وهذا الموقع شغّال بوضع الاستضافة الثابتة (مثل GitHub Pages). افتح الموقع من رابط سيرفر البوت عشان تظهر.</div></div>`;
    return;
  }
  app.innerHTML = '<div class="center">جاري تحميل الأوامر...</div>';
  let cmds;
  try { cmds = (await api('/api/commands')).commands; }
  catch (e) { app.innerHTML = '<div class="center">❌ تعذر تحميل الأوامر.</div>'; return; }

  const CAT = { raids:'⚔️ الرايدات والتوبات', moderation:'🛡️ الإشراف', greet:'👋 الترحيب والمغادرة والبوست', tickets:'🎫 التكت', activity:'📊 النشاط', backup:'💾 النسخ الاحتياطي', other:'✨ أخرى' };
  const catName = c => CAT[c] || c;
  const cats = [...new Set(cmds.map(c => c.category))];
  app.innerHTML = `
    <div class="sec-title" style="margin-top:6px">📖 شرح الأوامر</div>
    <div class="toolbar">
      <input type="text" id="q" placeholder="ابحث عن أمر...">
      <select id="cat"><option value="">كل الأقسام</option>${cats.map(c => `<option value="${esc(c)}">${esc(catName(c))}</option>`).join('')}</select>
    </div>
    <div id="list"></div>`;

  const draw = () => {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const cat = document.getElementById('cat').value;
    const shown = cmds.filter(c => (!cat || c.category === cat) &&
      (!q || c.name.toLowerCase().includes(q) || c.description.toLowerCase().includes(q)));
    if (!shown.length) { document.getElementById('list').innerHTML = '<div class="center">ما فيه نتائج.</div>'; return; }

    let html = '';
    for (const c of [...new Set(shown.map(x => x.category))]) {
      html += `<div class="cat-title">${esc(catName(c))}</div>`;
      for (const x of shown.filter(s => s.category === c)) {
        html += `<div class="cmd"><div class="cmd-h"><span class="cmd-name">/${esc(x.name)}</span>${x.adminOnly ? '<span class="badge">للإدارة</span>' : ''}</div>
          <p>${esc(x.description)}</p>
          ${x.options.length ? '<div class="opts">' + x.options.map(o => `<div class="opt"><code>${esc(o.name)}</code> ${o.required ? '(مطلوب)' : '(اختياري)'} — ${esc(o.description)}</div>`).join('') + '</div>' : ''}</div>`;
      }
    }
    document.getElementById('list').innerHTML = html;
  };
  document.getElementById('q').oninput = draw;
  document.getElementById('cat').onchange = draw;
  draw();
}

/* ───── لوحة التحكم: قائمة السيرفرات ───── */
const ROLE_LABEL = { owner: '👑 مالك السيرفر', admin: '🛡️ أدمن (Administrator)', manage: '⚙️ إدارة السيرفر (Manage Server)' };

async function renderDashboard() {
  if (!me.loggedIn) {
    const staticHelp = mode === 'static' ? `
      <details class="help"><summary>طلعلك خطأ Invalid OAuth2 redirect_uri؟ اضغط هنا</summary>
        <ol>
          <li>افتح <b>discord.com/developers/applications</b> واختر تطبيق البوت.</li>
          <li>من القائمة: <b>OAuth2</b> ← قسم <b>Redirects</b> ← <b>Add Redirect</b>.</li>
          <li>الصق هذا الرابط <b>بالضبط</b> (مع الشرطة بالنهاية) واضغط <b>Save Changes</b>:<br>
            <code id="ru">${esc(REDIRECT_URI)}</code> <button class="btn sm copy" id="cp">نسخ</button></li>
          <li>ارجع هنا واضغط تسجيل الدخول.</li>
        </ol></details>` : '';
    const off = mode === 'backend' && me.loginEnabled === false
      ? `<div class="warnbox">تسجيل الدخول غير مفعّل بسيرفر البوت: لازم يتضاف <code>CLIENT_SECRET</code> بمتغيرات البيئة.<br>وأضف هذا الرابط بـ Redirects: <code>${esc(me.redirectUri || '')}</code></div>` : '';
    app.innerHTML = `<div class="center"><h2 style="color:#fff;margin-bottom:10px">🔐 سجّل دخول بحساب ديسكورد</h2>
      <p style="margin-bottom:18px">عشان نتعرف على حسابك وسيرفراتك اللي أنت أدمن فيها.</p>
      ${off || '<a class="btn primary" href="/login" id="loginMain">تسجيل الدخول بديسكورد</a>'}${staticHelp}</div>`;
    const lm = document.getElementById('loginMain');
    if (lm && mode === 'static') lm.onclick = ev => { ev.preventDefault(); startLogin(); };
    const cp = document.getElementById('cp');
    if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(REDIRECT_URI); toast('تم نسخ الرابط ✅', 'ok'); } catch (e) { toast('انسخه يدوياً من المربع.', 'bad'); } };
    return;
  }

  const guilds = me.guilds;
  const note = mode === 'static' ? `<div class="note">✅ تم التعرف على حسابك. هذي السيرفرات اللي أنت فيها <b>مالك أو أدمن أو عندك إدارة السيرفر</b>.<br>إعدادات السيرفر من اللوحة تشتغل لما يتفتح الموقع من سيرفر البوت نفسه.</div>` : '';
  app.innerHTML = `<div class="sec-title" style="margin-top:6px">🏰 اختر السيرفر</div>${note}
    ${guilds.length ? '<div class="grid" id="gl"></div>' : '<div class="center">ما عندك سيرفرات تقدر تديرها (تحتاج صلاحية Administrator أو Manage Server).</div>'}`;
  const gl = document.getElementById('gl');
  if (!gl) return;
  gl.innerHTML = guilds.map(g => {
    const badge = g.role ? `<small><span class="role ${esc(g.role)}">${ROLE_LABEL[g.role]}</span></small>` : '';
    const action = mode === 'static'
      ? `<a class="btn green sm" target="_blank" rel="noopener" href="${INVITE}&guild_id=${esc(g.id)}&disable_guild_select=true">إضافة البوت</a>`
      : (g.botIn ? `<a class="btn primary sm" href="#/dashboard/${esc(g.id)}">إدارة</a>`
                 : `<a class="btn green sm" target="_blank" rel="noopener" href="${INVITE}&guild_id=${esc(g.id)}&disable_guild_select=true">إضافة</a>`);
    return `<div class="srv">
      ${g.icon ? `<img src="${esc(g.icon)}" alt="">` : `<div class="ph">${esc(g.name.charAt(0))}</div>`}
      <div class="nm">${esc(g.name)}${badge}</div>${action}</div>`;
  }).join('');
}

/* ───── لوحة التحكم: سيرفر محدد (وضع backend فقط) ───── */
async function renderGuild(id) {
  if (mode !== 'backend') {
    app.innerHTML = `<div class="center"><div class="note" style="max-width:560px;margin:auto">إعدادات السيرفر تحتاج تشغيل الموقع من سيرفر البوت.</div><br><a class="btn" href="#/dashboard">رجوع</a></div>`;
    return;
  }
  app.innerHTML = '<div class="center">جاري التحميل...</div>';
  let d;
  try { d = await api('/api/guild/' + id); }
  catch (e) {
    app.innerHTML = `<div class="center"><p style="color:#ff7b7e;margin-bottom:14px">❌ ${esc(e.message)}</p><a class="btn" href="#/dashboard">رجوع</a></div>`;
    return;
  }

  const errMsg = x => (x && typeof x === 'object') ? (x.ar || x.en || '') : (x || '');
  const logsData = d.logs || { types: d.types, settings: d.settings, errors: d.errors };

  const opts = sel => {
    const byCat = {};
    d.channels.forEach(c => (byCat[c.category || 'بدون قسم'] = byCat[c.category || 'بدون قسم'] || []).push(c));
    let h = '<option value="">— اختر روم —</option>';
    for (const [cat, list] of Object.entries(byCat)) {
      h += `<optgroup label="${esc(cat)}">` + list.map(c =>
        `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>#${esc(c.name)}${c.canSend ? '' : ' ⚠️'}</option>`).join('') + '</optgroup>';
    }
    return h;
  };
  const chById = Object.fromEntries(d.channels.map(c => [c.id, c]));

  app.innerHTML = `
    <a class="back" href="#/dashboard">← رجوع للسيرفرات</a>
    <div class="g-head">${d.guild.icon ? `<img src="${esc(d.guild.icon)}" alt="">` : ''}<h2>${esc(d.guild.name)}</h2></div>

    <div class="panel">
      <h3>⚡ تعيين روم واحد لكل السجلات</h3>
      <div class="quick"><select id="allCh">${opts('')}</select><button class="btn" id="applyAll">تطبيق على الكل</button></div>
    </div>

    <div class="sec-title" style="margin-top:6px">📜 السجلات (Logs)</div>
    <div id="logs">${logsData.types.map(t => {
      const s = logsData.settings[t.key] || {};
      return `<div class="log" data-t="${esc(t.key)}">
        <div class="log-h"><div class="log-t">${t.icon} ${esc(t.name)}</div>
          <label class="switch"><input type="checkbox" class="en" ${s.enabled ? 'checked' : ''}><span></span></label></div>
        <div class="log-d">${esc(t.desc)}</div>
        <div class="log-c"><select class="ch">${opts(s.channel_id)}</select><button class="btn sm test">🧪 اختبار</button></div>
        <div class="st"></div></div>`;
    }).join('')}</div>

    <div class="savebar"><button class="btn primary" id="save">💾 حفظ التغييرات</button></div>`;

  const rows = () => [...document.querySelectorAll('.log')];
  const setSt = (row, text, cls) => { const el = row.querySelector('.st'); el.textContent = text || ''; el.className = 'st ' + (cls || ''); row.classList.toggle('err', cls === 'bad'); };

  const refreshWarn = row => {
    const ch = chById[row.querySelector('.ch').value];
    if (ch && !ch.canSend) setSt(row, '⚠️ ' + errMsg(ch.sendError), 'warn');
    else if (!row.dataset.keep) setSt(row, '', '');
  };

  rows().forEach(row => {
    const t = row.dataset.t;
    const err = (logsData.errors || {})[t];
    if (err) { row.dataset.keep = '1'; setSt(row, '❌ آخر خطأ: ' + err.message, 'bad'); }
    else refreshWarn(row);
    row.querySelector('.ch').onchange = () => { delete row.dataset.keep; refreshWarn(row); };
    row.querySelector('.test').onclick = async () => {
      const chId = row.querySelector('.ch').value;
      if (!chId) { setSt(row, '❌ اختر روم أول.', 'bad'); return; }
      setSt(row, '⏳ جاري الاختبار...', '');
      try {
        await api('/api/guild/' + id + '/test', { type: t, channel_id: chId });
        setSt(row, '✅ وصلت رسالة الاختبار بالروم.', 'good');
      } catch (e) { setSt(row, '❌ ' + e.message, 'bad'); }
    };
  });

  document.getElementById('applyAll').onclick = () => {
    const v = document.getElementById('allCh').value;
    if (!v) { toast('اختر روم أول.', 'bad'); return; }
    rows().forEach(r => { r.querySelector('.ch').value = v; r.querySelector('.en').checked = true; delete r.dataset.keep; refreshWarn(r); });
    toast('تم التعيين، اضغط حفظ لتطبيق التغييرات.');
  };

  document.getElementById('save').onclick = async () => {
    const btn = document.getElementById('save');
    const payload = {};
    rows().forEach(r => payload[r.dataset.t] = { enabled: r.querySelector('.en').checked, channel_id: r.querySelector('.ch').value || null });
    for (const v of Object.values(payload)) {
      if (v.enabled && !v.channel_id) { toast('اختر روم للسجلات المفعّلة.', 'bad'); return; }
    }
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';
    try {
      const r = await api('/api/guild/' + id + '/logs', { logs: payload });
      const errs = Object.entries(r.errors || {});
      rows().forEach(row => { delete row.dataset.keep; setSt(row, '', ''); refreshWarn(row); });
      errs.forEach(([k, msg]) => { const row = document.querySelector(`.log[data-t="${k}"]`); if (row) { row.dataset.keep = '1'; setSt(row, '❌ ' + errMsg(msg), 'bad'); row.querySelector('.en').checked = false; } });
      errs.length ? toast(`تم الحفظ، لكن ${errs.length} سجل فيه خطأ (شوف الأحمر).`, 'bad') : toast('✅ تم حفظ الإعدادات.', 'ok');
    } catch (e) { toast('❌ ' + e.message, 'bad'); }
    btn.disabled = false; btn.textContent = '💾 حفظ التغييرات';
  };
}

/* ───── التنقل ───── */
async function route() {
  const h = (location.hash || '#/').slice(1);
  document.querySelectorAll('.links a').forEach(a => a.classList.remove('active'));
  const mark = r => document.querySelector(`.links a[data-r="${r}"]`)?.classList.add('active');
  const gm = h.match(/^\/dashboard\/(\d+)$/);

  if (h.startsWith('/commands')) { mark('commands'); return renderCommands(); }
  if (gm) { mark('dashboard'); if (!me.loggedIn) return renderDashboard(); return renderGuild(gm[1]); }
  if (h.startsWith('/dashboard')) { mark('dashboard'); return renderDashboard(); }
  mark('home'); return renderHome();
}

(async function init() {
  // 1) نقرأ رد ديسكورد لو راجع من تسجيل الدخول
  consumeOAuthResponse();

  // 2) نحدد الوضع: هل فيه سيرفر بوت يرد؟
  try {
    const r = await api('/api/me');
    if (r && typeof r.loggedIn === 'boolean') { mode = 'backend'; me = r; }
  } catch (e) { mode = 'static'; }

  // 3) بالوضع الثابت: نتعرف على الحساب والسيرفرات مباشرة من ديسكورد
  if (mode === 'static') me = await loadStaticSession();

  renderNav();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
